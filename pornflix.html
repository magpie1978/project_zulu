<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8" />
      
      <title>PornFlix</title>

        
      <!-- ======================================================
             STYLESHEETS
        ======================================================= -->
      <link rel="stylesheet" href="style/zulu.css" />
      <script src="https://unpkg.com/lucide@latest"></script>
      <link rel="icon" href="favicon.ico" sizes="any">
        
    </head>
    
    <body>
      <header class="site-header">
          <div class="header-logo">
              <img src="PORNFLIX.png" alt="Pornflix">
          </div>
          <div class="header-search">
              <input
                  type="text"
                  id="searchInput"
                  placeholder="Search actors or videos..."
                  autocomplete="off">
          </div>

          <div>
              <button id="add-video-btn" class="add-video-btn" type="button">
                  + Add Video
              </button>
          </div>
          
          <div class="header-actions">
              <button id="logoutButton" class="logout-button">
                  Logout
              </button>
          </div>
      </header>
      
      <main class="page-layout">
        <aside class="actor-sidebar">
          <h2>Actors</h2>
    
          <select id="actor-sort">
            <option value="actor-asc">Actor A-Z</option>
            <option value="actor-desc">Actor Z-A</option>
            <option value="count-desc">Most videos</option>
            <option value="count-asc">Fewest videos</option>
          </select>
    
          <div id="actor-sidebar-list"></div>
        </aside>
    
        <div class="main-content">
          <div class="video-toolbar">
            <label for="video-sort">Sort videos</label>
            <select id="video-sort">
              <option value="film-asc">Title A-Z</option>
              <option value="film-desc">Title Z-A</option>
              <option value="views-desc">Most watched</option>
              <option value="views-asc">Least watched</option>
            </select>
          </div>
    
          <section id="video-container" class="video-grid"></section>
        </div>
      </main>
    
      <div id="videoModal" class="modal">
        <div class="modal-content">
          <button class="close-button" id="closeModal">×</button>
          <video id="modalVideo" controls playsinline></video>
        </div>
      </div>

      <script type="module" src="js/zulu-videos2.js"></script>


        <!-- ======================================================
             ADD VIDEO MODAL
        ======================================================= -->

        <div id="add-video-modal" class="add-video-modal" aria-hidden="true">
          <div class="add-video-backdrop"></div>
        
          <div class="add-video-dialog" role="dialog" aria-modal="true">
            <button
              id="add-video-close"
              class="add-video-close"
              type="button"
              aria-label="Close"
            >
              ×
            </button>
        
            <h2>Add Video</h2>
        
            <div class="add-video-field">
              <label for="add-video-file">Video file</label>
        
              <input
                id="add-video-file"
                type="file"
                accept="video/mp4,.mp4"
              >
        
              <div id="add-video-file-info" class="add-video-file-info"></div>
            </div>
        
            <div class="add-video-field">
              <label for="add-video-title">Film title</label>
        
              <input
                id="add-video-title"
                type="text"
                autocomplete="off"
                placeholder="Film title"
              >
            </div>
        
            <div class="add-video-field">
              <label>Actors</label>
        
              <div id="add-video-actors"></div>
        
              <button
                id="add-video-add-actor"
                class="add-video-secondary-btn"
                type="button"
              >
                + Add actor
              </button>
            </div>
        
            <div class="add-video-field">
              <label for="add-video-tags">Tags</label>
        
              <input
                id="add-video-tags"
                type="text"
                autocomplete="off"
                placeholder="e.g. threesome, outdoor"
              >
            </div>
        
            <div id="add-video-status" class="add-video-status"></div>

              
            <div id="add-video-upload-progress-wrap" style="display:none;">
              <progress
                id="add-video-upload-progress"
                value="0"
                max="100"
                style="width:100%;">
              </progress>
            
              <div id="add-video-upload-progress-text">
                0%
              </div>
            </div>

              
            <div class="add-video-actions">
              <button
                id="add-video-cancel"
                class="add-video-secondary-btn"
                type="button"
              >
                Cancel
              </button>
        
              <button
                id="add-video-submit"
                class="add-video-primary-btn"
                type="button"
              >
                Upload Video
              </button>
            </div>
          </div>
        </div>

        
    </body>
</html>
